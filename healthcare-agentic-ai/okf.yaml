who_local_lookup:
  request: ../prompts/whoinc2.txt
  module: rag/who_lookup.py
  symbols: [WHOLookup, Source, DocumentMatch, LookupResult]
  command: 'python -m rag.who_lookup "asthma and diabetes"'
  tests: tests/test_who_lookup.py
  documentation: docs/who-lookup.md
  validation: docs/who-lookup-validation.json
  demo_output: outputs/who-lookup-demo.json
  inputs: Existing data/who_fact_sheets/index.json and data/who_questions_answers/index.json; no corpus/index writes.
  matching: Standard-library whole-word title/topic lookup; exact then phrase then conservative partial matches; generic/ambiguous matches abstain with explicit NO_MATCH; multiple sources/topics supported.
  provenance: Original title, URL, type, topic and filename; full matched text loaded after header/path validation; metadata-only search available.
  memory: Index metadata only between queries; sequential selected-text reads, no cache; 4096-character query, 5 MiB index, 4 MiB document and 20-result caps; no text truncation.
  verification: 28 new lookup plus 42 unchanged crawler tests passed; Initially 249 local entries, then 569 (244 Fact Sheets, 325 Q&A) after on-disk Q&A expansion; both checkpoints verified against source bytes; CLI works with site packages disabled; 479 protected files unchanged at initial checkpoint before collection update.
  boundary: No network, embeddings, vector DB, RAG integration, reranker, LLM or clinical inference; no AMG, Patient RAG, production agent/workflow, dependency, crawler or corpus edits.

