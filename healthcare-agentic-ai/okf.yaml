  architecture: Patient Agent -> unchanged CHECK4 catalog selector and content gate + unchanged AMG -> source-separated Combined Medical Evidence -> Diagnostic -> Grounding -> Critic -> Safety -> Final Decision.
  contract: Same 569-document catalog; maximum three selected WHO documents; exact complete source sections anchored by validated content quotes, never blind body prefixes; 12000 characters per document, oversize or ambiguous anchors fail closed.
  provenance: Stable catalog document IDs, URL/type/filename, catalog and document SHA-256, excerpt SHA-256 and character spans. Historical WHO backend key retained only for unchanged Grounding dispatch; selection method explicitly llm_catalog_verified_sections, no fabricated lexical terms.
  selector: CHECK4 prompt/schema/semantic validator bytes unchanged. Existing CHECK4 limits reused through shared client, max_output_tokens 1800 and max_retries zero; Diagnostic/Critic provider configuration unchanged.
  budgets: Every selector/content request uses existing EVIDENCE tickets and global request/byte/time accounting; sequential calls and retrieve-once snapshot reuse across revisions.
  failure_behavior: WHO source/quote/provider failures terminate safely before Diagnostic; no lexical fallback, weaker quote matching or hidden retries. Both sources empty retain existing abstention and pending review.
  verification: Baseline 728 project tests; final 752 (751 passed, one skip), 143 focused and 56 upstream passed. 24 new tests. Source/section/request/grounding/safety/final decision independently replay-verified offline.
  live_result: Manual hot-water observations completed in 49.20 seconds, five sequential requests, no repairs or technical failure; one WHO Burns section and one AMG Heat Illness passage. One WHO medical ID cited, zero AMG; unchanged Critic flags trigger deterministic Safety BLOCK and pending review.
  live_limitations: All six attempts retained. Five earlier attempts failed strict quote validation, including dog-bite source punctuation and DDXPlus patient quoting; 24 requests total. Only final hot-water run completed all gates; not general selector reliability or clinical success.
  unchanged: Grounding source, Diagnostic/Critic/Safety agents and policies, final-decision/human-review rules, AMG code/parameters, Patient RAG, WHO lookup/crawlers and all 577 existing WHO assets; no labels, index builds, dependency changes or new selector variant.

