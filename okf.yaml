check4_who_selector_evaluation:
  request: prompts/check4.txt
  selector: healthcare-agentic-ai/rag/who_catalog_selector.py
  content_gate: healthcare-agentic-ai/rag/who_selector_relevance.py
  runner: healthcare-agentic-ai/scripts/evaluate_who_selector_check4.py
  verifier: healthcare-agentic-ai/scripts/verify_who_selector_check4.py
  report: healthcare-agentic-ai/docs/check4-who-catalog-selector.md
  artifacts: healthcare-agentic-ai/outputs/check4-selector/
  status: Historical CHECK4 result; CHECK5 later explicitly authorizes default integration while retaining these reliability limitations.
  contract: v2 catalog shortlist and final output each hard-capped at three unique known IDs; semantic full-content gate with literal positive-patient/source quotes; no lexical selection, diagnosis, refill or retries.
  memory: Same 569 metadata entries; one selected full file and provider request at a time; existing file/catalog/request bounds, no truncation or model/vector loading.
  evaluation: Eight fixed hand-authored label-free cases; 13 sequential live requests, 37.15 seconds provider time; all completed. Four final documents in three cases, five abstentions; maximum observed two.
  quality: Four final documents topically relevant in limited coding-assistant source review; not clinical gold standard. One generic headache proposal rejected by content gate. No observed negation-driven selection; no Q&A selections, recall or repeatability validation.
  decision: Keep isolated. Catalog-only prompt is insufficient; actual downstream body-prefix handoff and truthful nonlexical provenance require separate validation before experimental wiring.
  verification: 45 focused tests passed; 728 full project tests (727 passed, one skip); 56 upstream passed. Five exact source events and four final selections independently replay-verified offline.
  unchanged: Production composition, AMG, Patient RAG, Diagnostic, Grounding, Critic, Safety, WHO lookup/crawlers/catalog/documents and dependency files. Prior dirty changes preserved.

check5_default_who_integration:
  request: prompts/check5.txt
  status: Implemented by explicit CHECK5 authorization; default WHO selection is now CHECK4, not lexical. Research only; strict quote failures remain a runtime limitation.
  composition: healthcare-agentic-ai/application/workflow.py
  service: healthcare-agentic-ai/rag/selector_evidence_service.py
  sections: healthcare-agentic-ai/rag/who_sections.py
  provenance_dispatch: healthcare-agentic-ai/rag/who_provenance.py
  combined_contract: healthcare-agentic-ai/rag/combined_medical_evidence.py
  accounting: healthcare-agentic-ai/orchestration/phase6/orchestrator.py
  batch: healthcare-agentic-ai/scripts/run_phase6.py
  manual: healthcare-agentic-ai/scripts/run_manual_who_amg.py
  verifier: healthcare-agentic-ai/scripts/verify_who_amg_run.py
  report: healthcare-agentic-ai/docs/check5-integration.md
  run_commands: AHS_RUN.txt
  artifacts: healthcare-agentic-ai/outputs/check5/
  architecture: Patient Agent -> unchanged CHECK4 catalog selector and content gate + unchanged AMG -> source-separated Combined Medical Evidence -> Diagnostic -> Treatment -> Grounding -> Critic -> Safety -> Final Decision.
