  input: Exact original CHECK3 label-free payload restored from prior input.json because the task prompt replaced the vignette.
  contract: Whole WHO catalog as ID/title/type/filename metadata only; strict zero-to-five unique known IDs; validate before sequential selected-file loading; truthful LLM-selector provenance, not fabricated lexical matches.
  catalog: Reuses validated WHOLookup private frozen metadata; 569 entries, collision checks and full catalog hash; no production lookup API change.
