  result: One successful selector call, 4.26 seconds, 69103 request bytes, 18662 input tokens and 62 output tokens. All five sources match pre-run/current hashes.
  comparison: Prior headache/UV-radiation/COPD lexical results not selected; known/chronic false-match titles absent this run. General negation handling and relevance of broad selections remain unproven.
